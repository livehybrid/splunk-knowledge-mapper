name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "4 5 * * 2"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

jobs:
  package:
    # ubuntu-24.04 because ubuntu-latest (26.04) has no Python 3.9, which the
    # add-on build and Splunk 10.1-and-earlier parity need.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          else
            TAG_VERSION="1.0.0"
          fi
          VERSION_WITH_HASH="${TAG_VERSION}+${SHORT_COMMIT_HASH}"
          echo "VERSION_WITH_HASH=${VERSION_WITH_HASH}" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: yarn install

      - name: Build Splunk app
        run: yarn run build

      - name: Update app version
        working-directory: packages/knowledge-mapper/stage
        run: |
          # Update app.conf with the calculated version (both [id] and [launcher] stanzas)
          if [ -f "default/app.conf" ]; then
            sed -i "s/version = .*/version = ${{ steps.version.outputs.VERSION_WITH_HASH }}/g" default/app.conf
          fi
          
          # Update app.manifest version if it exists
          if [ -f "app.manifest" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.VERSION_WITH_HASH }}\"/g" app.manifest
          fi

          # [install] build must change every release, or browsers keep serving the
          # old cached JS after an upgrade. Derived from the numeric version.
          V="${{ steps.version.outputs.TAG_VERSION }}"
          IFS=. read -r MAJ MIN PAT <<< "${V%%[-+]*}"
          if (( 10#$MIN > 99 || 10#${PAT:-0} > 99 )); then echo "::error::version $V does not fit the build scheme"; exit 1; fi
          BUILD=$(( 10#$MAJ * 10000 + 10#$MIN * 100 + 10#${PAT:-0} ))
          if grep -q '^build *=' default/app.conf; then sed -i "s/^build *=.*/build = ${BUILD}/" default/app.conf
          else sed -i "/^\[install\]/a build = ${BUILD}" default/app.conf; fi
          grep -q "^build = ${BUILD}$" default/app.conf
          
          # Update package id to match directory name without version suffix
          if [ -f "default/app.conf" ]; then
            sed -i "s/id = .*/id = knowledge-mapper/g" default/app.conf
          fi
          
          # Add reload trigger for splunk_create.conf if missing
          if [ -f "default/app.conf" ] && [ -f "default/splunk_create.conf" ]; then
            if ! grep -q "\[triggers\]" default/app.conf; then
              echo "" >> default/app.conf
              echo "[triggers]" >> default/app.conf
              echo "reload.splunk_create = simple" >> default/app.conf
            elif ! grep -q "reload.splunk_create" default/app.conf; then
              sed -i '/^\[triggers\]/a reload.splunk_create = simple' default/app.conf
            fi
          fi
          


      - name: Generate Package tarball
        shell: bash
        run: |
          mkdir -p dist
          if [ -d "packages/knowledge-mapper/stage" ]; then
            # Create a properly named directory structure for the tarball
            mkdir -p temp-package/knowledge-mapper
            cp -r packages/knowledge-mapper/stage/* temp-package/knowledge-mapper/
            
            # Create tarball with proper directory structure (avoids ./ prefixes and naming issues)
            cd temp-package
            tar -czf ../dist/knowledge-mapper-${{ steps.version.outputs.VERSION_WITH_HASH }}.tar.gz knowledge-mapper/
            
            # Cleanup
            cd ..
            rm -rf temp-package
          else
            echo "Error: stage directory not found after build"
            exit 1
          fi

      - name: Verify release version in the package
        # Tag builds only. Reads the tarball; the expected version comes from the
        # ref and git, independently of the version step.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          export WANT_VERSION="${GITHUB_REF#refs/tags/v}+$(git rev-parse --short HEAD)"
          python3 - dist/*.tar.gz <<'PY'
          import configparser, json, os, sys, tarfile
          want = os.environ["WANT_VERSION"]
          with tarfile.open(sys.argv[1]) as tar:
              raw = tar.extractfile("knowledge-mapper/default/app.conf").read().decode()
              names = tar.getnames()
              # this package ships no app.manifest; check it only if one appears
              manifest = json.load(tar.extractfile("knowledge-mapper/app.manifest")) if "knowledge-mapper/app.manifest" in names else None
          conf = configparser.ConfigParser(interpolation=None, strict=False)
          conf.read_string(raw)
          got = {"launcher.version": conf.get("launcher", "version", fallback=None),
                 "id.version": conf.get("id", "version", fallback=None),
                 "install.build": conf.get("install", "build", fallback=None),
                 **({"app.manifest": manifest["info"]["id"]["version"]} if manifest else {})}
          print(sys.argv[1], got)
          maj, mn, pat = (want.split("+")[0].split("-")[0].split(".") + ["0"])[:3]
          want_build = str(int(maj) * 10000 + int(mn) * 100 + int(pat))
          bad = [k for k, v in got.items() if v != (want_build if k == "install.build" else want)]
          if bad:
              sys.exit(f"package metadata is wrong for {want}: {bad}")
          PY

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload Stage Directory for Inspection
        uses: actions/upload-artifact@v4
        with:
          name: stage-contents
          path: packages/knowledge-mapper/stage/

  unit-test:
    name: unit-test (jest)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn
      - name: Install and test
        run: |
          yarn install --frozen-lockfile
          yarn test

  lookups-check:
    name: lookups-check (packaged lookups are where Splunk reads them)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download staged app
        uses: actions/download-artifact@v8
        with:
          name: stage-contents
          path: stage-app
      - name: Check lookups
        run: python3 .github/scripts/check_lookups.py stage-app

  e2e-playwright:
    name: e2e-playwright (real Splunk explorer) (${{ matrix.splunk }})
    needs: package
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 10.4.0 is the oldest Splunk this app is tested on; 10.6.0 is current.
        splunk: ["10.4.0", "10.6.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download staged app
        uses: actions/download-artifact@v8
        with:
          name: stage-contents
          path: stage-app
      - name: Make staged app readable by the container splunk user
        run: chmod -R 755 stage-app
      - name: Start Splunk (wait for health)
        working-directory: docker/e2e
        env:
          APP_DIR: ${{ github.workspace }}/stage-app
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 420
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e explorer check
        working-directory: e2e
        env:
          SPLUNK_WEB_URL: http://localhost:8000
          SPLUNK_MGMT_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
        run: npx playwright test
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-explorer-${{ matrix.splunk }}
          path: e2e/e2e-results/
          if-no-files-found: ignore
      - name: Splunk logs on failure
        if: failure()
        working-directory: docker/e2e
        run: docker compose logs --tail 200 splunk || true
      - name: Tear down
        if: always()
        working-directory: docker/e2e
        run: docker compose down -v || true

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
      - unit-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - e2e-playwright
      - lookups-check
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main 
